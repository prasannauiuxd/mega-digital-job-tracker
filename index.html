<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mega Digital – Job Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mut:#667085;--bd:#e2e5ea;--pri:#1d4ed8;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--okbg:#dcfce7;--warnbg:#fef3c7;--badbg:#fee2e2;--prib:#dbeafe}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151b;--card:#1b2029;--tx:#e8eaef;--mut:#9aa3b2;--bd:#2c3340;--pri:#6ea0ff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--okbg:#14351f;--warnbg:#3b2d0c;--badbg:#401717;--prib:#1c2a4a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
h1{font-size:17px;margin:0;flex:1}
nav{display:flex;overflow-x:auto;gap:2px;padding:0 8px}
nav button{border:0;background:none;color:var(--mut);padding:10px 12px;font:inherit;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--pri);border-color:var(--pri)}
main{max-width:1000px;margin:0 auto;padding:14px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.s{padding:5px 10px;font-size:13px}
.btn.d{background:var(--bad)}
input,select,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px}.stat span{color:var(--mut);font-size:13px}
.stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.bar input,.bar select{flex:1;min-width:140px;width:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.card h3{margin:0;font-size:16px}.mut{color:var(--mut);font-size:13px}
.steps{display:flex;gap:3px;margin:10px 0 6px;overflow-x:auto;padding-bottom:2px}
.st{flex:1;min-width:46px;text-align:center;font-size:10px;color:var(--mut)}
.st i{display:block;height:6px;border-radius:3px;background:var(--bd);margin-bottom:3px}
.st.d i{background:var(--ok)}.st.p i{background:var(--pri)}.st.n{opacity:.3}
.st.p{color:var(--pri);font-weight:700}.st.d{color:var(--ok)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--prib);color:var(--pri);margin:2px 4px 2px 0}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}
.info{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;margin-top:6px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:14px}
.modal{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:640px;margin:auto}
.modal h2{margin:0 0 10px;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
label{font-size:12px;font-weight:600;color:var(--mut);display:block;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:99px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip.n{text-decoration:line-through;opacity:.5}.chip.p{background:var(--prib);color:var(--pri);border-color:var(--pri)}.chip.d{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.sec{font-weight:700;margin:14px 0 6px;font-size:14px}
.warnbar{background:var(--warnbg);color:var(--warn);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.act{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
/* ---- colourful theme ---- */
:root{--bg:#fff7ef;--card:#fff;--tx:#2a1b3d;--mut:#7c6f8f;--bd:#f0e3d6;--pri:#7c3aed;--prib:#ede9fe;--ok:#059669;--okbg:#d1fae5;--warn:#d97706;--warnbg:#fef3c7;--bad:#e11d48;--badbg:#ffe4e6;--g1:linear-gradient(135deg,#ff7a18,#ff3d81 55%,#7c3aed)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17102a;--card:#241a3d;--tx:#f3ecff;--mut:#b3a5cc;--bd:#37295a;--pri:#b794ff;--prib:#3a2a66;--ok:#34d399;--okbg:#0f3a2e;--warn:#fbbf24;--warnbg:#4a3508;--bad:#fb7185;--badbg:#4d1224}}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg)}
body::before{background:#ff7a18}
header{background:var(--g1);border:0;box-shadow:0 6px 20px rgba(255,61,129,.35);border-radius:0 0 22px 22px}
.top{padding:14px 16px 6px}
h1{color:#fff;font-size:20px;font-weight:800;letter-spacing:-.3px}
#add{background:#fff;color:#e11d48;border-radius:99px;padding:9px 18px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.2)}
nav{padding:4px 10px 12px;gap:6px}
nav button{color:#fff;background:rgba(255,255,255,.18);border:0;border-radius:99px;padding:8px 14px;font-size:13px}
nav button.on{background:#fff;color:#e11d48;box-shadow:0 3px 10px rgba(0,0,0,.18)}
main{padding:18px 14px 40px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:0;border-radius:18px;padding:14px;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.12)}
.stat b{font-size:30px;font-weight:800;color:#fff!important}.stat span{color:rgba(255,255,255,.92);font-weight:500}
.stat i{position:absolute;right:10px;top:8px;font-size:30px;font-style:normal;opacity:.35}
.s1{background:linear-gradient(135deg,#7c3aed,#4f46e5)}.s2{background:linear-gradient(135deg,#ff3d81,#e11d48)}.s3{background:linear-gradient(135deg,#ff9f1c,#ff7a18)}.s4{background:linear-gradient(135deg,#06b6d4,#0ea5e9)}
.card{border:0;border-radius:18px;padding:15px;box-shadow:0 6px 18px rgba(124,58,237,.10);border-left:6px solid #ff7a18;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card h3{font-weight:700}
.bar input,.bar select,.modal input,.modal select,.modal textarea{border-radius:12px;border:2px solid var(--bd)}
.bar input:focus,.modal input:focus,.modal select:focus,.modal textarea:focus{outline:0;border-color:var(--pri)}
.btn{background:var(--g1);border-radius:12px;font-weight:700}
.btn.g{background:var(--card);color:var(--pri);border:2px solid var(--prib)}
.btn.d{background:var(--bad)}
.pg{height:10px;background:var(--bd);border-radius:99px;margin-top:12px;position:relative}
.pg b{display:block;height:100%;border-radius:99px;background:var(--g1);min-width:6px}
.pg em{position:absolute;right:0;top:-18px;font-size:11px;font-style:normal;font-weight:700;color:var(--pri)}
.steps{margin-top:8px}.st i{height:8px;border-radius:99px}
.st.d i{background:linear-gradient(90deg,#10b981,#34d399)}.st.p i{background:linear-gradient(90deg,#ff7a18,#ff3d81)}
.st.p{color:#e11d48}
.tag{background:var(--prib);color:var(--pri);padding:4px 11px}
.chip{border-width:2px;font-weight:600}
.chip.p{background:var(--prib);color:var(--pri);border-color:var(--pri)}
.ov{backdrop-filter:blur(4px);background:rgba(40,10,70,.55)}
.modal{border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal h2{background:var(--g1);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.empty{background:var(--card);border-radius:18px;border:2px dashed var(--bd);padding:40px 12px;font-size:15px}
.empty::before{content:"🪧";display:block;font-size:40px;margin-bottom:6px}
/* ---- brand theme ---- */
:root{--pri:#3b3689;--prib:#e8e7f7;--bad:#e32024;--badbg:#fde4e4;--g1:linear-gradient(120deg,#e32024,#b02a6b 50%,#3b3689)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pri:#a9a4ff;--prib:#2c2860;--bad:#ff6b6e;--badbg:#4d1a1c}}
body::before{background:#e32024}
.top{align-items:flex-start;padding:12px 14px 4px}
.brand{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.plate{background:#fff;border-radius:14px;padding:6px 12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.plate img{display:block;height:54px;width:auto;max-width:100%}
.dev{color:rgba(255,255,255,.85);font-size:10.5px;font-weight:500;letter-spacing:1.4px;font-style:italic;padding-left:4px}
#add{color:#e32024;margin-top:6px}
nav button.on{color:#3b3689}
.s1{background:linear-gradient(135deg,#3b3689,#5b54c9)}.s2{background:linear-gradient(135deg,#e32024,#ff5a5f)}
.s3{background:linear-gradient(135deg,#4a4545,#7a7272)}.s4{background:linear-gradient(135deg,#b02a6b,#3b3689)}
.card{border-left-color:#e32024}
.st.p{color:#e32024}.st.p i{background:linear-gradient(90deg,#e32024,#b02a6b)}
.st.d i{background:linear-gradient(90deg,#3b3689,#5b54c9)}.st.d{color:#3b3689}
@media (prefers-color-scheme:dark){.st.d{color:#a9a4ff}}
@media (max-width:420px){.plate img{height:44px}}
/* ---- white gradient theme ---- */
body{background:linear-gradient(180deg,#ffffff 0%,#fff4f4 45%,#eeeefb 100%) fixed}
body::before{background:#fff}
header{background:linear-gradient(120deg,#ffffff 0%,#ffffff 40%,#ffe9e9 72%,#e4e3f8 100%);box-shadow:0 8px 22px rgba(59,54,137,.14);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#e32024,#3b3689) 1;border-radius:0}
.plate{background:none;box-shadow:none;padding:0}
.plate img{height:62px}
.dev{color:#6b6478}
#add{background:linear-gradient(120deg,#e32024,#3b3689);color:#fff;box-shadow:0 4px 12px rgba(59,54,137,.35)}
nav button{background:#f1f0fb;color:#3b3689}
nav button.on{background:linear-gradient(120deg,#e32024,#3b3689);color:#fff;box-shadow:0 4px 12px rgba(59,54,137,.3)}
.empty::before{content:"📋"}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:linear-gradient(180deg,#17102a,#1f1740) fixed}}
@media (max-width:420px){.plate img{height:50px}}
/* ---- centred layout ---- */
.top{flex-direction:column;align-items:center;gap:8px;padding:14px 14px 6px;text-align:center}
.brand{flex:none;align-items:center;gap:4px}
.dev{padding-left:0;text-align:center}
#add{margin-top:2px;padding:9px 26px}
nav{flex-wrap:wrap;justify-content:center;overflow:visible;padding:4px 10px 12px}
.stat{text-align:center}
.stat i{position:static;display:block;opacity:1;font-size:24px;margin-bottom:2px}
.bar{justify-content:center}
.empty{text-align:center}
/* ---- daily scheduler ---- */
.dn{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.dl{text-align:center;font-size:15px}
.wkrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.wk{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:6px 2px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.wk small{color:var(--mut);font-size:11px}.wk b{font-size:16px}.wk i{font-style:normal;font-size:11px;font-weight:700;color:#e32024}
.wk.on{background:linear-gradient(120deg,#e32024,#3b3689);border-color:transparent;color:#fff}.wk.on small,.wk.on i{color:#fff}
.dr{display:flex;gap:12px;align-items:flex-start}
.dt{min-width:62px;font-weight:700;color:var(--pri);font-size:13px;padding-top:2px}
.db{flex:1;min-width:0}.da{display:flex;flex-direction:column;gap:6px}
.dr h3{margin:4px 0 2px}
.bar #dw{max-width:260px}
.pdfrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}.pdfrow .btn{flex:1;min-width:130px}
.hb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#team{background:#fff;color:#3b3689;border:2px solid #d9d7f0;box-shadow:0 3px 10px rgba(59,54,137,.15);border-radius:99px;padding:8px 18px;margin-top:2px}
.trow{display:flex;gap:8px;margin-bottom:6px}.trow input{flex:1}
.pz{border:3px dashed var(--bd);border-radius:16px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:14px;cursor:pointer;background:var(--card)}
.pz:focus{outline:0;border-color:var(--pri)}.pz.has{border-style:solid}
.pz img{max-width:100%;max-height:300px;border-radius:10px;border:1px solid var(--bd)}
.wkb{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.wkb .btn{flex:1;min-width:130px;padding:13px;font-size:15px}
.btn.ok{background:var(--ok)}.btn.red{background:var(--bad)}.btn.warn{background:var(--warn)}.btn.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
.wkt{border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0}.wkh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.wkg,.wks{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px;margin:8px 0;text-align:center}
.wkg div,.wks div{background:var(--bg);border-radius:8px;padding:6px;font-size:12px;color:var(--mut)}.wkg b,.wks b{display:block;font-size:14.5px;color:var(--tx);margin-top:2px}
.wkp{font-size:12.5px;color:var(--mut);padding:2px 0}.livebig{font-size:28px;font-weight:800;color:var(--pri)}
.acc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.acc button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:8px 12px;font-size:13px;cursor:pointer}.acc button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pc>summary{font-weight:700;padding:10px 4px;cursor:pointer;margin-top:6px}.pcz{color:var(--mut);padding:7px 4px;font-size:13px}
.sigw{display:block;width:100%;height:170px;border:2px dashed var(--bd);border-radius:12px;background:#fff;touch-action:none;margin:8px 0;cursor:crosshair}
.wkvs{margin:6px 0;padding:8px 10px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:13px}
@media(max-width:640px){
 input,select,textarea{font-size:16px!important}
 .btn{min-height:44px}.btn.s{min-height:42px;padding:9px 13px}
 .wkb .btn{min-width:calc(50% - 8px)}.wks,.wkg{grid-template-columns:repeat(2,1fr)}
 .acc button{padding:10px 14px;font-size:14px}
 .ov{padding:0;align-items:flex-end}.modal{max-width:100%;border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
 #nav{display:flex;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}#nav::-webkit-scrollbar{display:none}#nav button{flex:0 0 auto;white-space:nowrap;min-height:44px}
}
</style>
</head>

<main id="main"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const STAGES=["Enquiry","Design","Quotation","Customer approval","Advance payment","Production","Quality check","Final payment","Delivery / Installation","Service"];
const PRODUCTS=["Flex","Light board","Neon board","ACP board","Carving board","Job work","Bus panel work","UV print","Foam board","Acrylic board","QR stand","Roll-up standee","Other"];
let STAFF=["MD","Secretary","Receptionist 1","Receptionist 2","Designer 1","Designer 2","Designer 3","Welder","Helper","ACP worker","Accounts","Accounts helper"];
const TABS=[["day","📅 Today"],["work","⏱️ Work Report"],["act","🗂️ Activity"],["jobs","📋 Jobs"],["todo","✅ To-Do"],["prod","🏭 Production"],["inst","🔧 Installation"],["svc","🛠️ Service"],["card","🧾 Job Card"]];
const COLL={jobs:"jobs",todo:"tasks",svc:"complaints"};
const S={jobs:[],tasks:[],complaints:[],work:[],days:[],pwork:[]};
let tab="day",q="",db=null,mem=false,dayDate="",dayWho="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
const today=()=>ymd(new Date());
const addDays=(d,n)=>{const x=new Date(d+"T00:00");x.setDate(x.getDate()+n);return ymd(x)};
const fd=d=>d?new Date(d+"T00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short"}):"—";
const late=d=>d&&d<today();
const num=v=>Number(v)||0;
const inr=v=>"₹"+num(v).toLocaleString("en-IN");

async function save(c,item){
  const id=item.id;const data={...item};delete data.id;
  if(db){try{id?await db.collection(c).doc(id).set(data):await db.collection(c).add(data)}catch(e){alert("Could not save: "+(e.message||e.code))}}
  else{if(id){const i=S[c].findIndex(x=>x.id===id);S[c][i]=item}else S[c].push({...data,id:"m"+Math.random().toString(36).slice(2)});render()}
}
async function del(c,id){
  if(!await askYes("Delete this permanently?","Yes, delete"))return;
  if(db){try{await db.collection(c).doc(id).delete()}catch(e){alert("Could not delete")}}
  else{S[c]=S[c].filter(x=>x.id!==id);render()}
}
async function init(){
  try{db=await window.claude?.use("db")}catch(e){db=null}
  if(!db){mem=true;render();return}
  db.doc("settings/team").onSnapshot(sn=>{if(sn.exists){const d=sn.data();if(Array.isArray(d.staff)&&d.staff.length)STAFF=d.staff;if(d.pwHash)pwHash=d.pwHash}render()},()=>{});
  ["jobs","tasks","complaints","work","days","pwork"].forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));
}

let pwHash="6dbc32c533c7723b9169ce67ae2e1a10486322da925d6e631441fa2de429f891";
const sha=async t=>{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("mega|"+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")};
async function saveTeam(staff,hash){
  STAFF=staff;pwHash=hash;
  if(db){try{await db.doc("settings/team").set({staff,pwHash:hash})}catch(e){alert("Could not save team: "+(e.message||e.code))}}
  render();
}
let tdraft=[];
function teamLogin(){
  $("#modal").innerHTML=`<div class="ov"><div class="modal" style="max-width:360px"><h2>Manage team</h2><div class="mut" style="margin-bottom:8px">Enter the password to edit the responsible persons.</div>
  <input id="tpw" type="password" placeholder="Password" autocomplete="off"><div id="terr" style="color:var(--bad);font-size:13px;min-height:20px;margin-top:4px"></div>
  <div class="act"><button class="btn g" id="cx">Cancel</button><button class="btn" id="tgo">Unlock</button></div></div></div>`;
  setTimeout(()=>{const e=$("#tpw");if(e)e.focus()},50);
}
function teamRender(){
  const a=$("#tp1")?$("#tp1").value:"",b=$("#tp2")?$("#tp2").value:"";
  $("#modal").innerHTML=`<div class="ov"><div class="modal"><h2>Responsible persons</h2>
  <div class="mut" style="margin-bottom:8px">Edit names, add people or remove them. Renaming also updates the person’s existing jobs, to-dos and complaints.</div>
  ${tdraft.map((r,i)=>`<div class="trow"><input data-tn="${i}" value="${esc(r.name)}" placeholder="Name or role"><button class="btn d s" data-trm="${i}">✕</button></div>`).join("")}
  <button class="btn g s" id="tadd" style="margin-top:6px">+ Add person</button>
  <div class="sec">Change password <span class="mut">(leave empty to keep the current one)</span></div>
  <div class="grid"><input id="tp1" type="password" placeholder="New password (min 6 characters)" autocomplete="new-password"><input id="tp2" type="password" placeholder="Repeat new password" autocomplete="new-password"></div>
  <div class="act"><button class="btn g" id="cx">Cancel</button><button class="btn" id="tsave">Save</button></div></div></div>`;
  $("#tp1").value=a;$("#tp2").value=b;
}
async function teamSave(){
  const rows=tdraft.map(r=>({old:r.old,name:r.name.trim()})).filter(r=>r.name);
  const names=rows.map(r=>r.name);
  if(!names.length){alert("Keep at least one person.");return}
  if(new Set(names.map(x=>x.toLowerCase())).size!==names.length){alert("Two people have the same name. Please make each name different.");return}
  let hash=pwHash;const p1=$("#tp1").value,p2=$("#tp2").value;
  if(p1||p2){
    if(p1!==p2){alert("The two new passwords do not match.");return}
    if(p1.length<6){alert("The password must have at least 6 characters.");return}
    hash=await sha(p1);
  }
  const ren=rows.filter(r=>r.old&&r.old!==r.name);
  for(const r of ren){
    for(const [c,list] of [["jobs",S.jobs],["tasks",S.tasks],["complaints",S.complaints]]){
      for(const it of list.filter(x=>x.assigned===r.old)){await save(c,{...it,assigned:r.name})}
    }
  }
  await saveTeam(names,hash);
  $("#modal").innerHTML="";
  alert("Team saved."+(p1?" Password changed.":""));
}
function isSvc(j){const st=j.steps||{};return j.visitType==="Service visit"||((curStage(j)==="Service"||(!curStage(j)&&st.Service===2))&&!STAGES.slice(0,-1).some(x=>st[x]===2))}
function curStage(j){const st=j.steps||{};for(const s of STAGES){if(st[s]===1)return s}return null}
function nextDue(j){return j.expDelivery||""}
function jobName(id){const j=S.jobs.find(x=>x.id===id);return j?(j.customer+" – "+(j.product||"")):""}
function match(o){return !q||JSON.stringify(o).toLowerCase().includes(q.toLowerCase())}

function stepsBar(j){
  const st=j.steps||{};
  const act=STAGES.filter(s=>st[s]!==0),dn=act.filter(s=>st[s]===2).length,pct=act.length?Math.round(dn*100/act.length):0;
  return `<div class="pg"><b style="width:${pct}%"></b><em>${pct}%</em></div><div class="steps">${STAGES.map(s=>{const v=st[s];const c=v===2?"d":v===1?(curStage(j)===s?"p":""):"n";return `<div class="st ${c}"><i></i>${esc(s.split(" ")[0])}</div>`}).join("")}</div>`;
}
function jobCard(j){
  const cur=curStage(j);
  const bal=num(j.amount)-num(j.advance)-num(j.finalPaid);
  const od=late(j.expDelivery)&&cur;
  return `<div class="card"><div class="row"><div><h3>${esc(j.customer)} <span class="mut">${esc(j.phone)}</span></h3>
  <div class="mut">${esc(j.product)} ${j.desc?"· "+esc(j.desc):""}</div></div>
  <div>${cur?`<span class="tag">Now: ${esc(cur)}</span>`:`<span class="tag ok">✓ Completed</span>`}</div></div>
  ${stepsBar(j)}
  <div class="info"><span>👤 ${esc(j.assigned||"Unassigned")}</span>
  <span class="${od?"tag bad":""}">📦 Delivery: ${fd(j.expDelivery)}</span>
  ${j.instDate?`<span>🔧 Install: ${fd(j.instDate)} ${esc(j.instTime)}</span>`:""}

function payCheck(j,stage){
  if(stage==="Advance payment"){
    if(num(j.amount)<=0)return "Enter the quotation amount first.";
    if(num(j.advance)<=0)return "Enter the advance amount received before marking Advance payment as done.";
  }
  if(stage==="Final payment"){
    if(num(j.amount)<=0)return "Enter the quotation amount first.";
    const bal=num(j.amount)-num(j.advance)-num(j.finalPaid);
    if(bal>0)return "Balance "+inr(bal)+" is still pending. Enter the final payment received first.";
  }
  return "";
}

function loadImg(blob){
  const u=URL.createObjectURL(blob),im=new Image();
  im.onload=()=>{
    const sc=Math.min(1,2600/Math.max(im.width,im.height)),w=Math.round(im.width*sc),h=Math.round(im.height*sc);
    const c=document.createElement("canvas");c.width=w;c.height=h;
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
    jc.img=c.toDataURL("image/jpeg",0.92);jc.w=w;jc.h=h;URL.revokeObjectURL(u);render();
  };
  im.onerror=()=>{URL.revokeObjectURL(u);alert("Could not read that image. Please take the screenshot again.")};
  im.src=u;
}

const sigSaved=()=>{const d=S.days.find(x=>x.emp==="__sign"&&x.date==="cfg");return d&&d.img?d:null};
function sigInit(){
  const c=document.getElementById("sigpad");if(!c||c._i)return;c._i=1;
  const dpr=Math.min(3,window.devicePixelRatio||1),w=c.clientWidth||320,h=c.clientHeight||170;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);
  const x=c.getContext("2d");x.lineCap="round";x.lineJoin="round";x.strokeStyle="#0b1a7a";x.fillStyle="#0b1a7a";x.lineWidth=2.6*dpr;
  if(jc.sigRaw){const im=new Image();im.onload=()=>x.drawImage(im,0,0,c.width,c.height);im.src=jc.sigRaw}
  let dr=false,lx=0,ly=0;const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.addEventListener("pointerdown",e=>{e.preventDefault();dr=true;sigBusy=true;try{c.setPointerCapture(e.pointerId)}catch(_){}const q=pt(e);lx=q[0];ly=q[1];x.beginPath();x.arc(lx,ly,x.lineWidth/2,0,6.3);x.fill()});
  c.addEventListener("pointermove",e=>{if(!dr)return;e.preventDefault();const q=pt(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(q[0],q[1]);x.stroke();lx=q[0];ly=q[1]});
  const end=()=>{if(!dr)return;dr=false;sigBusy=false;jc.sigRaw=c.toDataURL("image/png")};
  c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end);
}
function sigCrop(src){return new Promise(res=>{if(!src)return res(null);const im=new Image();im.onload=()=>{
  const c=document.createElement("canvas");c.width=im.width;c.height=im.height;const x=c.getContext("2d");x.drawImage(im,0,0);
  const d=x.getImageData(0,0,c.width,c.height).data;let a=c.width,b=c.height,e=-1,f=-1;
  for(let yy=0;yy<c.height;yy++)for(let xx=0;xx<c.width;xx++)if(d[(yy*c.width+xx)*4+3]>20){if(xx<a)a=xx;if(xx>e)e=xx;if(yy<b)b=yy;if(yy>f)f=yy}
  if(e<a){res(null);return}
  const p=4,sx=Math.max(0,a-p),sy=Math.max(0,b-p),sw=Math.min(c.width-sx,e-a+1+2*p),sh=Math.min(c.height-sy,f-b+1+2*p),sc=Math.min(1,600/sw);
  const o=document.createElement("canvas");o.width=Math.max(1,Math.round(sw*sc));o.height=Math.max(1,Math.round(sh*sc));o.getContext("2d").drawImage(c,sx,sy,sw,sh,0,0,o.width,o.height);
  res({url:o.toDataURL("image/png"),w:o.width,h:o.height})};im.onerror=()=>res(null);im.src=src})}

  $("#modal").innerHTML=`<div class="ov"><div class="modal"><h2>${item?"Edit":"New"} ${fm.title}</h2>
  <div class="grid">${fm.fields.map(f=>field(f,cur[f.k]??"")).join("")}</div>
  ${c==="jobs"?`<div class="sec">Steps for this job <span class="mut">(tap to change: blue = to do, green = done, struck = not needed)</span></div><div class="chips" id="chips"></div>`:""}
  <div class="act">${item?`<button class="btn d" id="del">Delete</button>`:""}<button class="btn g" id="cx">Cancel</button><button class="btn" id="sv">Save</button></div></div></div>`;
  if(c==="jobs")chips();
}
function chips(){
  $("#chips").innerHTML=STAGES.map(s=>{const v=cur.steps[s];return `<button class="chip ${v===2?"d":v===1?"p":"n"}" data-chip="${esc(s)}">${v===2?"✓ ":""}${esc(s)}</button>`}).join("");
}
function collect(){
  FORMS[curC].fields.forEach(f=>{const e=$("#f_"+f.k);if(e)cur[f.k]=e.value});
  return cur;
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.wk){wkClick(t.dataset.wk);return}
  if(t.dataset.ac){acClick(t.dataset.ac);return}
  if(t.dataset.tab){tab=t.dataset.tab;q="";render();return}
  if(t.id==="add"&&(tab==="work"||tab==="act")){tab="jobs";render();return}
  if(t.id==="add"){openForm({card:"jobs",day:"tasks",jobs:"jobs",todo:"tasks",prod:"jobs",inst:"jobs",svc:"complaints"}[tab]);return}
  if(t.dataset.edit){const[c,id]=t.dataset.edit.split(":");openForm(c,S[c].find(x=>x.id===id));return}
  if(t.dataset.adv){advance(t.dataset.adv);return}
  if(t.dataset.chip){const s=t.dataset.chip,v=cur.steps[s];cur.steps[s]=v===1?2:v===2?0:1;chips();return}
  if(t.id==="cpaste"){pasteBtn();return}
  if(t.id==="cclear"){jc.img=null;render();return}
  if(t.id==="cmake"){makeCard();return}
  if(t.id==="team"){teamLogin();return}
  if(t.id==="tgo"){(async()=>{const h=await sha($("#tpw").value);if(h===pwHash){tdraft=STAFF.map(n=>({old:n,name:n}));teamRender()}else{$("#terr").textContent="Wrong password. Try again."}})();return}
  if(t.id==="tadd"){tdraft.push({old:"",name:""});teamRender();const i=document.querySelectorAll("[data-tn]");if(i.length)i[i.length-1].focus();return}
  if(t.dataset.trm!==undefined){tdraft.splice(+t.dataset.trm,1);teamRender();return}
  if(t.id==="tsave"){teamSave();return}
  if(t.dataset.pdf){sharePdf(t.dataset.pdf);return}
  if(t.dataset.dd){dayDate=t.dataset.dd==="today"?today():addDays(dayDate||today(),+t.dataset.dd);render();return}
  if(t.dataset.jump){dayDate=t.dataset.jump;render();return}
  if(t.dataset.tdone){const x=S.tasks.find(i=>i.id===t.dataset.tdone);x.status="Done";save("tasks",x);return}
  if(t.id==="cx"){$("#modal").innerHTML="";return}
  if(t.id==="del"){del(curC,cur.id).then(()=>{$("#modal").innerHTML=""});return}
  if(t.id==="sv"){
    const d=collect();
    if(curC==="jobs"){for(const st of ["Advance payment","Final payment"]){if(d.steps&&d.steps[st]===2){const m=payCheck(d,st);if(m){alert(st+": "+m);return}}}}
    if(curC==="jobs"&&!d.customer?.trim()||curC==="tasks"&&!d.title?.trim()||curC==="complaints"&&!d.customer?.trim()){alert("Please fill the name or title first.");return}
    save(curC,d);$("#modal").innerHTML="";
  }
});
document.addEventListener("input",e=>{if(e.target.id==="sq"){q=e.target.value;render()}
  if(e.target.dataset&&e.target.dataset.cf){jc[e.target.dataset.cf]=e.target.value}
  if(e.target.dataset&&e.target.dataset.tn!==undefined&&tdraft[+e.target.dataset.tn])tdraft[+e.target.dataset.tn].name=e.target.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="tpw"){const b=$("#tgo");if(b)b.click()}});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="fs"||t.id==="ft")render();
  if(t.id==="dw"){dayWho=t.value;render()}
  if(t.dataset.ts){const x=S.tasks.find(i=>i.id===t.dataset.ts);x.status=t.value;save("tasks",x)}
  if(t.dataset.cs){const x=S.complaints.find(i=>i.id===t.dataset.cs);x.status=t.value;save("complaints",x)}
});
render();init();
</script>
</body>
</html>
